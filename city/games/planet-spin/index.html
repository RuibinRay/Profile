<body class="game">
  <header class="hud">
    <a class="hud__back" href="../../#game-2" data-back><span aria-hidden="true">&lt;</span> Game City</a>
    <h1 class="hud__name">Planet Spin</h1>
    <div class="hud__tools">

      <button class="hud__btn" id="mute" type="button" aria-pressed="true">Sound on</button>
